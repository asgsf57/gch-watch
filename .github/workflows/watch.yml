# Alerts go out over ntfy/Pushcut from the checker itself. A run only FAILS -
# and so only emails you - when something is actually wrong: the checker broke,
# or a room opened up and the push didn't make it out.
name: GCH watch

on:
  schedule:
    # Every 5 minutes, deliberately offset off the :00/:05 boundary.
    # GitHub deprioritizes schedules on the hour and on round 5s, so these
    # odd minutes get picked up more reliably. Delays are still possible -
    # GitHub makes no timing guarantee for scheduled workflows.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

concurrency:
  group: gch-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check availability
        id: check
        env:
          CHECK_IN:   ${{ secrets.CHECK_IN }}
          CHECK_OUT:  ${{ secrets.CHECK_OUT }}
          HOTEL:      ${{ secrets.HOTEL }}
          ADULTS:     ${{ secrets.ADULTS }}
          CHILDREN:   ${{ secrets.CHILDREN }}
          CHILD_AGES: ${{ secrets.CHILD_AGES }}
          NTFY_TOPIC:  ${{ secrets.NTFY_TOPIC }}
          MAX_NIGHTLY: ${{ secrets.MAX_NIGHTLY }}
          PUSHCUT_URL: ${{ secrets.PUSHCUT_URL }}
        run: |
          # Steps run under `bash -e`, so capture the code without aborting.
          # Script: 0 = rooms in budget, 1 = nothing to alert on, >1 = real failure.
          code=0
          python3 gch_watch.py --once --no-voice --no-open \
            --log "$GITHUB_WORKSPACE/run.log" || code=$?

          if [ "$code" -gt 1 ]; then
            echo "::error::Checker failed - the Disney API may have changed."
            { echo "## Checker error"; echo '```'; cat run.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          if [ "$code" -eq 0 ]; then
            { echo "# ROOMS AVAILABLE - BOOK NOW"
              echo ""
              echo "<https://disneyland.disney.go.com/hotels/grand-californian-hotel/rates-rooms/>"
              echo ""
              echo '```'; cat run.log; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # The push is the alert. Fall back to a failing run (and its
            # email) only if no push channel confirmed a send - either one
            # reported FAILED, or none was configured at all.
            if ! grep -qE '(ntfy push|pushcut) sent' run.log; then
              echo "::error::ROOMS AVAILABLE and no push got out - book now"
              exit 1
            fi
            echo "Rooms available - push sent."
            exit 0
          fi

          echo "Nothing to alert on."
          echo "Nothing in budget as of this run." >> "$GITHUB_STEP_SUMMARY"
